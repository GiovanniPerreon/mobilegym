# Selection-based matrix for node 43: the three configurations that the selection report supports with a signal
# (everything else is at the 0.9% noise floor). Q4_K_M weights, F16 vision projector, temperature 0.
#
#   Qwen3-VL-4B  screenshot_gen   38.5% (15/39), progress 48.3%   <- the only configuration with real signal
#   Qwen3.5-2B   screenshot_gen   best small model (1/38, progress 12.7%)
#   Qwen3.5-0.8B json_img_gen     best of the 0.8B (0/39, progress 6.0%)
#
# Run first in the `unlimited` profile (4 cores, no memory limit): it gives the memory peak (VmHWM), the speeds and the
# context actually used (join.json: context_tokens_max). Feasibility against the budgets follows from the peak; the
# limited profiles are run afterwards only where it is borderline. 10 of the 40 selection tasks keep the run short
# (same instances: --sample-n 1 --sample-seed 0).

env_url: http://localhost:4173
models_dir: /home/perreon/edge_models
profiles_file: edge/profiles.yaml
profiles: [unlimited]

bench_image: mobilegym_full:latest
docker_network: edgenet
bench_cores: "24-31"
slot: 5                                   # server on cores 20-23

bench_args: >-
  --task-ids bilibili.OpenRankingTask,bilibili.SetSexTask,calendar.ChangeDefaultReminder,clock.ToggleAlarm,notes.CreateFolderAndMoveNote,sms.OpenConversationBySender,tencent_meeting.CheckContactCount,weather.CheckCurrentTemp,weather.EnableNightDnd,wechat.ReadContactRegion
  --sample-n 1 --sample-seed 0 --preset paper --judge-mode state --temperature 0

parallel: 1
infer_timeout: 3600
load_timeout: 900
default_ctx: 16384
server_image: ghcr.io/ggml-org/llama.cpp:server
server_args: "--jinja"
load_flags: "--load-mode none"

models:
  - id: qwen35-0.8b-q4km-json-img-gen
    gguf: Qwen3.5-0.8B-Q4_K_M.gguf
    mmproj: Qwen3.5-0.8B-mmproj-F16.gguf
    model_name: qwen3.5-0.8b
    agent: generic_text
    bench_args: "--obs json --obs-image"
    ctx: 16384
    server_args: >-
      --jinja --chat-template-kwargs '{"enable_thinking":false}'

  - id: qwen35-2b-q4km-screenshot-gen
    gguf: Qwen3.5-2B-Q4_K_M.gguf
    mmproj: Qwen3.5-2B-mmproj-F16.gguf
    model_name: qwen3.5-2b
    agent: generic_v2
    ctx: 16384
    server_args: >-
      --jinja --chat-template-kwargs '{"enable_thinking":false}'

  - id: qwen3vl-4b-q4km-screenshot-gen
    gguf: Qwen3VL-4B-Instruct-Q4_K_M.gguf
    mmproj: mmproj-Qwen3VL-4B-Instruct-F16.gguf
    model_name: qwen3-vl-4b
    agent: generic_v2
    ctx: 16384
    server_args: "--jinja"
